# Settings of the unifi_docker_compose role; override them in your inventory
# or where you apply the role.

# The application version, e.g. 10.6.109, or latest: the newest release,
# so every run upgrades to it. Set a version to pin it.
unifi_version: latest
# The application image, without a tag (the tag is unifi_version): by
# default the published one, pulled from its registry. A localhost/ image,
# e.g. localhost/unifi-network-application, is built on the host instead with
# app/build.sh, which looks up the download's checksum from Ubiquiti.
unifi_image: ghcr.io/peku33/unifi-network-application
unifi_build_extra_args: "" # extra "docker build" args, e.g. "--pull"
# MongoDB's image tag: 8 is the newest 8.x release. 4.4.18 for CPUs without
# AVX (amd64) or older than ARMv8.2-A (arm64); see README.md#cpu-support in
# the repository root.
unifi_mongo_version: "8"

# .env settings (TZ, PUID, UNIFI_HTTP_PORT, ...), merged over the defaults in
# docker-compose/.env.example. The application ports are published under the
# same numbers.
unifi_env: {}
# system_ip in system.properties: the address devices are told to inform to.
# Empty: not set.
unifi_system_ip: "{{ ansible_facts.default_ipv4.address }}"
# Other system.properties settings (UNIFI_PROPERTIES in .env).
unifi_properties: {}

# Where compose/ (compose.yaml, .env) and, when building, app/ go.
unifi_dir: /opt/unifi-network-application
